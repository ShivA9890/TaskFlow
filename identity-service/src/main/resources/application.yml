server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: taskflow
    password: taskflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

taskflow:
  jwt:
    private-key-location: file:./keys/jwt-private.pem
    key-id: taskflow-identity-1
    issuer: http://localhost:8081
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  invite:
    ttl: 7d
    accept-base-url: http://localhost:5173/accept-invite
  seed: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.flywaydb: info
