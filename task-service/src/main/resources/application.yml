server:
  port: 8082

spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_tasks
    username: taskflow
    password: taskflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/api/v1/auth/.well-known/jwks.json
          issuer-uri: http://localhost:8081

taskflow:
  reminder:
    stall-window: 48h
  internal:
    # Shared secret for the reminder job's service-to-service call. Not a user token.
    service-token: local-dev-service-token

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
