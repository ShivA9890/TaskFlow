server:
  port: 8082 

spring:
  application:
    name: task-service 
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow_tasks}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    open-in-view: false 
    hibernate:
      ddl-auto: validate 
    properties:
      hibernate:
        jdbc:
          time_zone: UTC 
  flyway:
    enabled: true 
    locations: classpath:db/migration 
  security:
    oauth2:
      resourceserver:
        jwt:
          # In K8s, localhost won't work. We inject the internal Kubernetes Service DNS here.
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}

taskflow:
  reminder:
    stall-window: 48h 
  internal:
    # Shared secret for the reminder job's service-to-service call. Not a user token.
    service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-service-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info 
  endpoint:
    health:
      probes:
        enabled: true 