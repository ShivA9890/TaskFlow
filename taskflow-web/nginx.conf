server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # React Router does client-side routing. A direct load or refresh of
    # /board/abc-123 asks nginx for a file that does not exist, so fall back to
    # index.html and let the app resolve the route. Without this, every refresh
    # on a non-root path returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints filenames (app-4f2c1a.js), so a changed file gets a new
    # name. Safe to cache these for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html keeps the same name across deploys, so it must never be cached.
    # A stale index.html points at asset filenames that no longer exist and the
    # page loads blank after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Kubernetes probes. Kept out of the access log so it stays readable.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff  always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
}